name: "test and scan"

on: 
  push:
      branches:
        - main

jobs:
  run_tests:  
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [tasks-api, title-normalizer] # ${{matrix.service}}
        python-version: ["3.10", "3.11", "3.12"] # ${{matrix.python-version}}  
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "${{ matrix.python-version }}"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/${{ matrix.service }}/requirements.txt
      - name: Run tests
        run: |
          python -m pytest services/${{ matrix.service }} | tee services/${{ matrix.service }}/test-results-${{ matrix.python-version }}.txt
      - name: Archive artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ matrix.service }}-test-results-${{ matrix.python-version }}
          path: services/${{ matrix.service }}/test-results-${{ matrix.python-version }}.txt
  