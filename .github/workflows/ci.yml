name: "test and scan"

on: 
  push:
      branches:
        - main

jobs:
  run_tests:  
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/tasks-api/requirements.txt
      - name: Run tests
        run: |
          python -m pytest services/tasks-api